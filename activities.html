<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESPERS | 활동/수상</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">ESPERS</a>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">홈</a></li>
                    <li><a href="notice.html">공지사항</a></li>
                    <li><a href="about.html">임원진 소개</a></li>
                    <li><a href="activities.html" class="active">활동/수상</a></li>
                    <li><a href="gallery.html">갤러리</a></li>
                    <li><a href="join.html">지원안내</a></li>
                </ul>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="page-top">
        <section class="page-hero soft-blue">
            <div class="container">
                <h1 class="page-title">활동 및 수상경력</h1>
                <p class="page-desc">ESPERS의 주요 활동 내용 및 수상경력을 소개합니다.</p>
            </div>
        </section>

        <section class="section light-section">
            <div class="container">
                <h2 class="section-title">2025년 주요 활동</h2>

                <div class="gallery-grid">
                    <div class="card image-card">
                        <img src="assets/수상/라인트레이싱.jpg" alt="교내 라인트레이싱" class="zoomable" />
                        <p>교내 라인트레이싱</p>
                    </div>

                    <div class="card image-card">
                        <img src="assets/수상/하계 부트캠프.jpg" alt="발표 활동" class="zoomable" />
                        <p>coss 하계 부트캠프</p>
                    </div>

                    <div class="card image-card">
                        <img src="assets/수상/한이음.png" alt="한이음" class="zoomable" />
                        <p>한이음 드림업</p>
                    </div>

                    <div class="card image-card">
                        <img src="assets/수상/붕짜.jpg" alt="붕짜" class="zoomable" />
                        <p>붕짜 나들이</p>
                    </div>

                    <div class="card image-card">
                        <img src="assets/수상/교육.jpg" alt="교육" class="zoomable" />
                        <p>방학 교육 특강</p>
                    </div>

                    <div class="card image-card">
                        <img src="assets/수상/종강파티.jpg" alt="정기 모임" class="zoomable" />
                        <p>종강파티</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="award-title-wrap">
                    <h2 class="section-title">수상 경력</h2>
                    <button id="awardOpenBtn" type="button" class="award-plus-btn" style="display: none;">+</button>
                </div>

                <div class="award-scroll-box" id="awardScrollBox">
                    <div class="award-list" id="awardList"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="awardModal" class="award-modal">
        <div class="award-modal-box">
            <button id="awardModalClose" type="button" class="award-modal-close">&times;</button>

            <h2 class="award-modal-title">수상 기록 추가</h2>

            <input type="text" id="awardTitle" placeholder="수상명 입력" />
            <textarea id="awardDesc" placeholder="설명 입력"></textarea>

            <button id="addAwardBtn" type="button" class="btn primary">수상 기록 등록</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-wrap">
            <p>© 2026 ESPERS</p>
            <p>문의: st.espers@gmail.com</p>
        </div>
    </footer>

    <div id="imageModal" class="image-modal">
        <span class="image-modal-close" id="imageModalClose">&times;</span>
        <img class="image-modal-content" id="imageModalImg" alt="확대 이미지" />
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
