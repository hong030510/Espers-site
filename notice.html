<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESPERS | 공지사항</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">ESPERS</a>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">홈</a></li>
                    <li><a href="notice.html" class="active">공지사항</a></li>
                    <li><a href="about.html">임원진 소개</a></li>
                    <li><a href="activities.html">활동/수상</a></li>
                    <li><a href="gallery.html">갤러리</a></li>
                    <li><a href="join.html">지원안내</a></li>
                </ul>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="page-top">
        <section class="page-hero soft-blue">
            <div class="container">
                <h1 class="page-title">공지사항</h1>
                <p class="page-desc">동아리 운영, 모집, 행사 관련 공지를 확인할 수 있습니다.</p>
            </div>
        </section>

        <section class="section">
            <div class="container small-container">
                <div class="notice-list-board">
                    <div class="notice-list-head">
                        <div>제목</div>
                        <div class="notice-date-head">
                            <span>작성일</span>
                            <button id="noticeOpenBtn" type="button" class="notice-plus-btn">+</button>
                        </div>
                    </div>
                    <div id="noticeBoard">
                        <div class="notice-empty">공지사항을 불러오는 중입니다.</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="noticeWriteModal" class="notice-write-modal">
        <div class="notice-write-modal-box">
            <button id="noticeWriteModalClose" type="button" class="notice-write-modal-close">&times;</button>

            <h2 class="notice-write-modal-title">공지 등록</h2>

            <input type="text" id="noticeTitleInput" placeholder="공지 제목 입력" />
            <textarea id="noticeContentInput" placeholder="공지 내용을 입력하세요."></textarea>

            <button id="noticeSubmitBtn" type="button" class="btn primary">공지 등록</button>
        </div>
    </div>
    <div id="noticeModal" class="notice-modal">
        <div class="notice-modal-box">
            <button id="noticeModalClose" class="notice-modal-close">&times;</button>
            <div class="notice-modal-top">
                <span class="notice-modal-badge">공지</span>
                <span id="noticeModalDate" class="notice-modal-date"></span>
            </div>
            <h2 id="noticeModalTitle" class="notice-modal-title"></h2>
            <div id="noticeModalContent" class="notice-modal-content"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-wrap">
            <p>© 2026 ESPERS</p>
            <p>문의: st.espers@gmail.com</p>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>

</html>
